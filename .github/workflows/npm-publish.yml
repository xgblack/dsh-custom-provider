# npm Trusted Publishing (OIDC) — no npm token, no OTP.
# Register this workflow on npmjs.com → package → Settings → Trusted Publisher
# with: user xgblack, repo dsh-custom-provider, filename npm-publish.yml.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      - run: npm test
      - run: npm publish
