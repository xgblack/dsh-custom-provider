# npm Trusted Publishing (OIDC) — no npm token, no OTP.
# Register this workflow on npmjs.com → package → Settings → Trusted Publisher
# with: user xgblack, repo dsh-custom-provider, filename npm-publish.yml.
#
# Pushing a v* tag does both: publish to npm, then create the matching GitHub
# Release (notes generated from the commits since the previous tag).
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: write # create the GitHub Release for the pushed tag

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm installs the locked devDependencies that `npm test` needs (jsdom, react).
      # Keep it before actions/setup-node so that a future `cache: pnpm` still works.
      - uses: pnpm/action-setup@v6
        with:
          version: '10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm publish

  release:
    needs: publish # only after the package really landed on npm
    runs-on: ubuntu-latest
    steps:
      # gh is preinstalled on ubuntu-latest; the workflow token creates the release.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
